<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Week - Reset Kitchen</title>
<meta name="description" content="The week's batch-cooked meals at a glance.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('index.html');
const w = weekData();
const win = activeWindow();
const slug = cuisineSlug(w.cuisine);
const st = resetState();
const mon = mondayForCycleWeek(w.n);
const cookDay = addDays(mon, -1);
const todayISO = iso(today());
const bday = CONFIG.birthday ? parseISO(CONFIG.birthday) : null;
const nextWeek = WEEKS[w.n % WEEKS.length];

const pct = st.started ? Math.min(100, Math.round((st.resetWeek - 1) / CONFIG.resetWeeks * 100)) : 0;

let banner = '';
if (!st.started) {
  banner = `<div class="card"><b>Week 1 starts Monday ${esc(fmtShort(parseISO(CONFIG.cycleStart)))}.</b> Market Sat ${esc(fmtShort(addDays(parseISO(CONFIG.cycleStart), -2)))}, cook Sun ${esc(fmtShort(addDays(parseISO(CONFIG.cycleStart), -1)))}.</div>`;
} else if (st.done) {
  banner = `<div class="card"><b>Twelve weeks done.</b> Time to redraw the bloodwork. The cycle keeps repeating in the meantime.</div>`;
}

$('#main').innerHTML = `
  <header class="mast">
    ${cuisineGround(slug)}
    <span class="num" aria-hidden="true">${w.n}</span>
    <p class="eyebrow">${cuisineGlyph(slug, 26)}<span>Week ${w.n} of the cycle</span><span class="dot"></span><span>${esc(w.cuisine)}</span></p>
    <h1>${esc(w.title)}</h1>
    <p class="lede">${esc(weekInOneLine(w, cookDay))}</p>
    <div class="facts">
      <div><span>Cook day</span><b>Sun ${esc(fmtShort(cookDay))}, ${esc(w.cookTime)}</b></div>
      <div><span>The dinners</span><b>${esc(dinnerMix(w))}</b></div>
      ${st.started && !st.done ? `<div><span>Reset</span><b>Week ${st.resetWeek} of ${CONFIG.resetWeeks}</b></div>` : ''}
    </div>
    <details class="extra why"><summary>Why this week looks like this</summary><div class="extra-body"><p class="note-n">${esc(w.theme)}</p></div></details>
    ${st.started && !st.done ? `<div class="bar" style="margin-top:var(--s-3)"><i style="width:${pct}%"></i></div>` : ''}
  </header>
  <div id="wb"></div>
  ${banner}
  <div class="tools">
    <a class="btn" href="cook.html">Sunday cook plan (${esc(w.cookTime)})</a>
    <a class="btn" href="shopping.html">Shopping list</a>
    <a class="btn" href="recipes.html">All recipes</a>
  </div>
  <h2 style="margin-top:var(--s-5)">Dinner, night by night</h2>
  <div class="grid days" id="days"></div>

  <h2>In the fridge, eat by</h2>
  <div class="card"><div id="keeps"></div></div>

  <h2>Into the freezer</h2>
  <div class="card">
    <div id="bank"></div>
    <p class="muted" style="margin-top:.7rem">Date every bag, and log it on the <a href="freezer.html">Storage page</a>.</p>
  </div>
`;

weekBar('#wb');
$('#keeps').innerHTML = (w.keeps || []).map(k => {
  const by = addDays(cookDay, k.days);
  const gone = iso(by) < todayISO;
  return `<div class="frz${gone ? ' zero' : ''}">
    <span class="n">${esc(k.what)}</span>
    <span class="age">${k.days >= 30 ? 'keeps a month' : 'eat by ' + esc(fmtDay(by))}</span>
  </div>`;
}).join('');

$('#bank').innerHTML = (w.freezer || []).map(f =>
  `<div class="frz"><span class="n">${esc(f.what)}</span><span class="age">${f.months} month${f.months === 1 ? '' : 's'}</span></div>`
).join('');

/* The grid opens with the Sunday before Monday, because that cook day is
   what makes the rest of the week possible and it is the one thing that has
   to happen on a date. Two Sundays are in play in any week and this is the
   earlier one. */
const madeList = w.days.slice(0, 5).filter(d => d.src === 'sunday' || d.src === 'assemble');
const bankList = w.days.slice(0, 5).filter(d => daySrc(d) === 'freezer');
const cookIsToday = iso(cookDay) === todayISO;
const cookCard = `
  <div class="day cookday${cookIsToday ? ' today' : ''}"${cookIsToday ? ' id="today"' : ''}>
    <div class="dh">
      <b>Sun</b>
      <span class="date">${esc(fmtShort(cookDay))}</span>
      <span class="spacer"></span>
      ${cookIsToday ? '<span class="pill today">Today</span>' : ''}
    </div>
    <div class="dinner fresh">
      <p class="dl"><span>Cook day</span><span class="tm">${esc(w.cookTime)}</span></p>
      <p class="dm">One pot: ${esc(potName(w))}. It makes ${esc(listOf(madeList.map(d => d.day)))} dinner.</p>
      <p class="dsrc"><span class="badge fresh">Do this first</span><a href="cook.html">Open the cook plan</a></p>
    </div>
    <p class="cooklist">Market: Sat ${esc(fmtShort(addDays(cookDay, -1)))}${bankList.length ? ' &middot; ' + esc(listOf(bankList.map(d => d.day))) + ' comes out of the freezer' : ''}</p>
    <details class="extra"><summary>What it makes</summary><div class="extra-body"><p class="note-n">${(w.keeps || []).map(k => esc(k.what)).join('. ')}.</p></div></details>
  </div>`;

$('#days').innerHTML = cookCard + w.days.map((d, i) => {
  const date = addDays(mon, i);
  const isToday = iso(date) === todayISO;
  const isPast = iso(date) < todayISO && st.started && !st.done;
  const isBday = bday && iso(date) === iso(bday);
  const m1r = d.m1r ? recipeChip(d.m1r) : '';
  const m2r = d.m2r ? recipeChip(d.m2r) : '';
  const also = (d.also || []).filter(id => RECIPES[id]);
  const snack = d.snack || w.snack;
  const bdayNote = isBday
    ? '<b>Turning 41.</b> Make this the free meal for the week and go wherever you actually want. If it is Korean BBQ, order galbi and chadolbaegi and a mountain of lettuce and skip the rice and the soju, and you will have had a real celebration that costs the reset nothing. One planned meal is not a relapse, it is the thing that keeps the other eighty-three on track.'
    : '';
  const src = dinnerSrc(d);

  /* Charlie's 10am and 2pm are his alone, and so is the training note. They
     go behind the toggle so the card answers one question at a glance. */
  const mine = [
    `<div class="meal"><span class="when">${esc(win.first)}</span><span class="what">${proteinTag(d.m1)}${esc(d.m1)}${m1r}</span></div>`,
    snack ? `<div class="meal"><span class="when">${esc(win.snack)}</span><span class="what">${proteinTag(snack)}${esc(snack)}</span></div>` : '',
    d.post ? `<p class="note-p"><b>After the Tonal.</b> ${esc(d.post)}</p>` : '',
    bdayNote ? `<p class="note-p">${bdayNote}</p>` : '',
    d.note ? `<p class="note-n">${esc(d.note)}</p>` : '',
    also.length ? `<p class="alsoline">Also: ${also.map(id => `<a href="recipes.html#${id}">${esc(RECIPES[id].name)}</a>`).join(', ')}</p>` : '',
  ].filter(Boolean);

  return `
  <div class="day${isToday ? ' today' : ''}${d.free ? ' free' : ''}${isPast ? ' past' : ''}" ${isToday ? 'id="today"' : ''}>
    <div class="dh">
      <b>${esc(d.day)}</b>
      <span class="date">${esc(fmtShort(date))}</span>
      <span class="spacer"></span>
      ${isToday ? '<span class="pill today">Today</span>' : ''}
      ${isBday ? '<span class="pill free">Birthday</span>' : ''}
    </div>
    <div class="dinner ${src.cls}">
      <p class="dl"><span>Dinner</span><span class="tm">${esc(win.dinner)}</span><span class="spacer"></span>${proteinTag(d.m2)}</p>
      <p class="dm">${esc(d.m2)}${m2r}</p>
      <p class="dsrc"><span class="badge">${esc(src.label)}</span>${d.src === 'cookday'
        ? `for next week &middot; <a href="cook.html?w=${nextWeek.n}">Week ${nextWeek.n} plan</a>` : ''}</p>
    </div>
    ${d.kid ? `<p class="note-k"><b>Kid:</b> ${esc(d.kid)}</p>` : ''}
    <details class="extra"><summary>Charlie's 10am and 2pm</summary><div class="extra-body">${mine.join('')}</div></details>
  </div>`;
}).join('');

/* jump back to today, shown only once today has scrolled out of view */
const todayCard = $('#today');
if (todayCard) {
  setTimeout(() => todayCard.scrollIntoView({ block: 'center', behavior: 'smooth' }), 200);
  document.body.insertAdjacentHTML('beforeend', '<button class="totoday" id="jt">Today</button>');
  const btn = $('#jt');
  btn.onclick = () => todayCard.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(
      ([e]) => btn.classList.toggle('on', !e.isIntersecting),
      { threshold: 0.15 }
    ).observe(todayCard);
  }
}
</script>
</body>
</html>
