<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Week - Reset Kitchen</title>
<meta name="description" content="The week's batch-cooked meals at a glance.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('index.html');
const w = weekData();
const win = activeWindow();
const st = resetState();
const mon = mondayForCycleWeek(w.n);
const cookDay = addDays(mon, -1);
const todayISO = iso(today());
const bday = CONFIG.birthday ? parseISO(CONFIG.birthday) : null;

const pct = st.started ? Math.min(100, Math.round((st.resetWeek - 1) / CONFIG.resetWeeks * 100)) : 0;

let banner = '';
if (!st.started) {
  banner = `<div class="card"><b>Week 1 starts Monday ${esc(fmtShort(parseISO(CONFIG.cycleStart)))}.</b>
    <p class="muted" style="margin:.35rem 0 0">Farmers market the Saturday before (${esc(fmtShort(addDays(parseISO(CONFIG.cycleStart), -2)))}), cook the Sunday (${esc(fmtShort(addDays(parseISO(CONFIG.cycleStart), -1)))}). Start with the <a href="plan.html">Plan</a> and the <a href="shopping.html">Shopping list</a>.</p></div>`;
} else if (st.done) {
  banner = `<div class="card"><b>Twelve weeks done.</b><p class="muted" style="margin:.35rem 0 0">Time to get the bloodwork redrawn and compare it to your baseline. The cycle keeps repeating in the meantime, and by now the freezer is doing most of the work.</p></div>`;
}

$('#main').innerHTML = `
  <header class="mast">
    <span class="num" aria-hidden="true">${w.n}</span>
    <p class="eyebrow"><span class="dot"></span>Week ${w.n} of the cycle<span class="dot"></span>${esc(w.cuisine)}</p>
    <h1>${esc(w.title)}</h1>
    <p class="lede">${esc(w.theme)}</p>
    <div class="facts">
      <div><span>Stew nights</span><b>${w.days.slice(0, 5).filter(d => /soup|stew|jjigae|chili|brais/i.test(d.m2)).length} of 5</b></div>
      <div><span>Cook day</span><b>Sunday ${esc(fmtShort(cookDay))}, ${esc(w.cookTime)}</b></div>
      <div><span>Dinners</span><b>${esc(dinnerMix(w))}</b></div>
      <div><span>Into the freezer</span><b>${w.freezer.length} kind${w.freezer.length === 1 ? '' : 's'}</b></div>
      ${st.started && !st.done ? `<div><span>Reset</span><b>Week ${st.resetWeek} of ${CONFIG.resetWeeks}</b></div>` : ''}
    </div>
    ${st.started && !st.done ? `<div class="bar" style="margin-top:var(--s-3)"><i style="width:${pct}%"></i></div>` : ''}
  </header>
  <div id="wb"></div>
  <div id="win"></div>
  ${banner}
  <div class="tools">
    <a class="btn" href="cook.html">Sunday cook plan (${esc(w.cookTime)})</a>
    <a class="btn" href="shopping.html">Shopping list</a>
    <a class="btn" href="recipes.html">All recipes</a>
  </div>
  <div class="grid days" id="days"></div>

  <h2>In the fridge, and by when</h2>
  <div class="card">
    <p class="muted" style="margin:0 0 .6rem">Cooked Sunday ${esc(fmtShort(cookDay))}. These are the dates to work backwards from, and the reason nothing in this plan gets thrown away.</p>
    <div id="keeps"></div>
  </div>

  <h2>Into the freezer this week</h2>
  <div class="card">
    <div id="bank"></div>
    <p class="muted" style="margin-top:.7rem">Date every bag as it goes in and keep the count current on the <a href="freezer.html">Storage page</a>. Two or three cycles of this and any night can be a reheat of your choosing, which is the whole point of the plan.</p>
  </div>
`;

weekBar('#wb');
windowPicker('#win');

$('#keeps').innerHTML = (w.keeps || []).map(k => {
  const by = addDays(cookDay, k.days);
  const gone = iso(by) < todayISO;
  return `<div class="frz${gone ? ' zero' : ''}">
    <span class="n">${esc(k.what)}</span>
    <span class="age">${k.days >= 30 ? 'keeps a month' : 'eat by ' + esc(fmtDay(by))}</span>
  </div>`;
}).join('');

$('#bank').innerHTML = (w.freezer || []).map(f =>
  `<div class="frz"><span class="n">${esc(f.what)}</span><span class="age">${f.months} month${f.months === 1 ? '' : 's'}</span></div>`
).join('');

$('#days').innerHTML = w.days.map((d, i) => {
  const date = addDays(mon, i);
  const isToday = iso(date) === todayISO;
  const isPast = iso(date) < todayISO && st.started && !st.done;
  const isBday = bday && iso(date) === iso(bday);
  const m1r = d.m1r ? recipeChip(d.m1r) : '';
  const m2r = d.m2r ? recipeChip(d.m2r) : '';
  const also = (d.also || []).filter(id => RECIPES[id]);
  const snack = d.snack || w.snack;
  const bdayNote = isBday
    ? '<b>Turning 41.</b> Make this the free meal for the week and go wherever you actually want. If it is Korean BBQ, order galbi and chadolbaegi and a mountain of lettuce and skip the rice and the soju, and you will have had a real celebration that costs the reset nothing. One planned meal is not a relapse, it is the thing that keeps the other eighty-three on track.'
    : '';
  const extras = [
    d.post ? `<p class="note-p"><b>After the Tonal.</b> ${esc(d.post)}</p>` : '',
    bdayNote ? `<p class="note-p">${bdayNote}</p>` : '',
    d.kid ? `<p class="note-k"><b>Son:</b> ${esc(d.kid)}</p>` : '',
    d.note ? `<p class="note-n">${esc(d.note)}</p>` : '',
    also.length ? `<p class="alsoline">Also: ${also.map(id => `<a href="recipes.html#${id}">${esc(RECIPES[id].name)}</a>`).join(', ')}</p>` : '',
  ].filter(Boolean);

  return `
  <div class="day${isToday ? ' today' : ''}${d.free ? ' free' : ''}${isPast ? ' past' : ''}" ${isToday ? 'id="today"' : ''}>
    <div class="dh">
      <b>${esc(d.day)}</b>
      <span class="date">${esc(fmtShort(date))}</span>
      <span class="spacer"></span>
      ${isToday ? '<span class="pill today">Today</span>' : ''}
      ${isBday ? '<span class="pill free">Birthday</span>' : ''}
      ${d.free ? '<span class="pill free">Free meal</span>' : ''}
      <span class="pill ${d.lift ? 'lift' : 'rest'}">${d.lift ? 'Tonal' : 'Rest'}</span>
    </div>
    <div class="meal"><span class="when">${esc(win.first)}</span><span class="what">${proteinTag(d.m1)}${esc(d.m1)}${m1r}</span></div>
    ${snack ? `<div class="meal"><span class="when">${esc(win.snack)}</span><span class="what">${proteinTag(snack)}${esc(snack)}</span></div>` : ''}
    <div class="meal"><span class="when">${esc(win.dinner)}</span><span class="what">${proteinTag(d.m2)}${esc(d.m2)}${m2r}</span></div>
    ${extras.length ? `<details class="extra"${isToday ? ' open' : ''}><summary>${extras.length} note${extras.length === 1 ? '' : 's'}</summary><div class="extra-body">${extras.join('')}</div></details>` : ''}
  </div>`;
}).join('');

if ($('#today')) setTimeout(() => $('#today').scrollIntoView({ block: 'center', behavior: 'smooth' }), 200);
</script>
</body>
</html>
