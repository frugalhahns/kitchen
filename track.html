<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress - Reset Kitchen</title>
<meta name="description" content="Weight, waist and lab dates. Stored only in this browser.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('track.html');
$('#main').innerHTML = `
  <h1>Progress</h1>
  <p class="lede">Once a week, same morning, same conditions. Waist at the navel is the number that answers the belly-fat question, and it often moves when the scale will not. Everything here is saved only in this browser and is never sent anywhere.</p>
  <div id="prof"></div>

  <div class="card">
    <div class="inputrow">
      <label>Date<input type="date" id="d"></label>
      <label>Weight (lb)<input type="number" step="0.2" id="wt" inputmode="decimal"></label>
      <label>Waist (in)<input type="number" step="0.25" id="ws" inputmode="decimal"></label>
      <button id="save">Log it</button>
    </div>
    <div class="stat" id="stats"></div>
  </div>

  <div class="card" id="chartcard" hidden>
    <h3>Trend</h3>
    <div id="chart"></div>
  </div>

  <div class="card">
    <table class="log"><thead><tr><th>Date</th><th>Weight</th><th>Change</th><th>Waist</th><th>Change</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
    <p class="muted" id="empty" hidden style="margin-top:.6rem">Nothing logged yet. Weigh in Saturday morning and start the baseline.</p>
  </div>

  <h2>${esc(FUEL.waist.title)}</h2>
  <div class="card">
    <p style="margin-top:0">${esc(FUEL.waist.body)}</p>
    ${FUEL.waist.points.map(x => `<div class="qa"><b>${esc(x.p)}</b><p>${esc(x.d)}</p></div>`).join('')}
  </div>

  <h2>Bloodwork</h2>
  <div class="card">
    <p style="margin-top:0">${esc(PROTOCOL.labs.body)}</p>
    <div class="inputrow" style="margin-top:1rem">
      <label>Panel drawn<input type="date" id="labd"></label>
      <label style="width:auto">Note<input type="text" id="labn" placeholder="baseline, week 12..." style="width:12rem"></label>
      <button id="labsave">Log panel</button>
    </div>
    <table class="log"><thead><tr><th>Date</th><th>Note</th><th></th></tr></thead><tbody id="labrows"></tbody></table>
  </div>
`;

$('#d').value = iso(today());
$('#labd').value = iso(today());

const fmt = (v, u) => v == null || v === '' ? '<span class="muted">-</span>' : v + (u || '');
function delta(cur, prev, u) {
  if (cur == null || prev == null) return '<span class="muted">-</span>';
  const d = +(cur - prev).toFixed(1);
  if (d === 0) return '<span class="muted">even</span>';
  const col = d < 0 ? 'var(--green)' : 'var(--accent)';
  return `<span style="color:${col}">${d > 0 ? '+' : ''}${d}${u || ''}</span>`;
}

/* Line: 2px round cap/join. Markers r>=4 with a 2px surface ring so they stay
   legible where they overlap. Target rule is a solid hairline, not dashed:
   dashing reads as "projection" when it is just a threshold. Hover gives a
   crosshair and a tooltip, because an SVG chart is interactive by default. */
function sparkline(pts, color, target, unit, label) {
  if (pts.length < 2) return '';
  const w = 720, h = 140, padX = 8, padT = 18, padB = 24;
  const xs = pts.map((p, i) => padX + i * (w - 2 * padX) / (pts.length - 1));
  const vals = pts.map(p => p.v).concat(target != null ? [target] : []);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const y = (v) => h - padB - ((v - min) / span) * (h - padT - padB);
  const ys = pts.map(p => y(p.v));
  const d = xs.map((x, i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + ys[i].toFixed(1)).join(' ');
  const last = pts.length - 1;
  const pointData = pts.map((p, i) => `${xs[i].toFixed(1)},${ys[i].toFixed(1)},${p.v},${esc(p.d || '')}`).join(';');

  return `<div class="chart" data-points="${pointData}" data-unit="${esc(unit || '')}">
    <svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;height:auto;overflow:visible" role="img" aria-label="${esc(label || '')} over time">
      ${target != null ? `<line x1="${padX}" y1="${y(target).toFixed(1)}" x2="${w - padX}" y2="${y(target).toFixed(1)}" stroke="var(--line-2)" stroke-width="1"/>
        <text x="${padX}" y="${(y(target) + 14).toFixed(1)}" font-size="11" fill="var(--ink-3)">target ${target}${esc(unit || '')}</text>` : ''}
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>`).join('')}
      <text x="${xs[last].toFixed(1)}" y="${(ys[last] - 11).toFixed(1)}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink-2)">${pts[last].v}${esc(unit || '')}</text>
    </svg>
    <div class="ttip"></div>
  </div>`;
}

/* one hover handler for every chart on the page */
function wireCharts(root) {
  root.querySelectorAll('.chart').forEach(box => {
    const svg = box.querySelector('svg');
    const tip = box.querySelector('.ttip');
    const unit = box.dataset.unit || '';
    const pts = (box.dataset.points || '').split(';').filter(Boolean).map(s2 => {
      const [x, y, v, dt] = s2.split(',');
      return { x: +x, y: +y, v, d: dt };
    });
    if (!pts.length) return;
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * 720;
      let best = pts[0];
      pts.forEach(p => { if (Math.abs(p.x - cx) < Math.abs(best.x - cx)) best = p; });
      tip.textContent = best.d ? `${best.d}  ${best.v}${unit}` : `${best.v}${unit}`;
      tip.style.left = (best.x / 720 * r.width) + 'px';
      tip.style.top = (best.y / 140 * r.height) + 'px';
      tip.classList.add('on');
    };
    box.addEventListener('pointermove', move);
    box.addEventListener('pointerleave', () => tip.classList.remove('on'));
  });
}

function draw() {
  const log = store.get('log', []).slice().sort((a, b) => a.d.localeCompare(b.d));
  $('#empty').hidden = log.length > 0;

  $('#rows').innerHTML = log.map((e, i) => {
    const p = i > 0 ? log[i - 1] : null;
    return `<tr>
      <td>${esc(e.d)}</td>
      <td>${fmt(e.wt)}</td><td>${delta(e.wt, p && p.wt != null ? p.wt : null)}</td>
      <td>${fmt(e.ws, '"')}</td><td>${delta(e.ws, p && p.ws != null ? p.ws : null, '"')}</td>
      <td><button data-del="${esc(e.d)}">remove</button></td>
    </tr>`;
  }).reverse().join('');

  const prof = store.get('fuel', {});
  const waistTarget = prof.ht ? +(prof.ht / 2).toFixed(1) : null;
  const goal = prof.gw || null;

  $('#prof').innerHTML = waistTarget
    ? `<div class="card"><div class="flag reset" style="margin:0"><b>Your targets:</b>
        waist under <b>${waistTarget}"</b>, which is half your height and the 0.5 waist-to-height line${goal ? `, and <b>${goal} lb</b> on the scale` : ''}.
        Waist is the one to trust. Set on the <a href="fuel.html">Fuel page</a>.</div></div>`
    : `<div class="card"><p class="muted" style="margin:0">Put your height in on the <a href="fuel.html">Fuel page</a> and this page will show your waist target next to what you measured. Nothing leaves the browser.</p></div>`;

  const wts = log.filter(e => e.wt != null).map(e => ({ v: +e.wt, d: e.d }));
  const wss = log.filter(e => e.ws != null).map(e => ({ v: +e.ws, d: e.d }));
  const first = wts[0], last = wts[wts.length - 1];
  const fw = wss[0], lw = wss[wss.length - 1];
  const toWaist = waistTarget && lw ? +(lw.v - waistTarget).toFixed(1) : null;
  const toGoal = goal && last ? +(last.v - goal).toFixed(1) : null;
  const dW = first && last ? +(last.v - first.v).toFixed(1) : null;
  const dS = fw && lw ? +(lw.v - fw.v).toFixed(2) : null;
  const dir = (v) => v == null || v === 0 ? '' : v < 0 ? ' class="down"' : ' class="up"';
  const sign = (v) => (v > 0 ? '+' : '') + v;
  $('#stats').innerHTML = `
    <div><b class="hero">${lw ? lw.v + '"' : '-'}</b><span>Waist now</span></div>
    <div><b${dir(dS)}>${dS != null ? sign(dS) + '"' : '-'}</b><span>Waist since start</span></div>
    ${toWaist != null ? `<div><b>${toWaist > 0 ? toWaist + '"' : 'There'}</b><span>To go, target ${waistTarget}"</span></div>` : ''}
    <div><b>${last ? last.v : '-'}</b><span>Weight now, lb</span></div>
    <div><b${dir(dW)}>${dW != null ? sign(dW) : '-'}</b><span>Weight since start, lb</span></div>
    ${toGoal != null ? `<div><b>${toGoal > 0 ? toGoal : 'There'}</b><span>To go, goal ${goal} lb</span></div>` : ''}`;

  const c = $('#chart');
  if (wts.length > 1 || wss.length > 1) {
    $('#chartcard').hidden = false;
    c.innerHTML =
      (wts.length > 1 ? `<p class="eyebrow" style="margin:.2rem 0">Weight, lb</p>` + sparkline(wts, 'var(--series-1)', goal, ' lb', 'Weight') : '') +
      (wss.length > 1 ? `<p class="eyebrow" style="margin:1rem 0 .2rem">Waist, inches</p>` + sparkline(wss, 'var(--series-2)', waistTarget, '"', 'Waist') : '');
    wireCharts(c);
  } else {
    $('#chartcard').hidden = true;
  }

  $('#rows').querySelectorAll('button[data-del]').forEach(b => {
    b.onclick = () => {
      store.set('log', store.get('log', []).filter(e => e.d !== b.dataset.del));
      draw();
    };
  });

  const labs = store.get('labs', []).slice().sort((a, b) => a.d.localeCompare(b.d));
  $('#labrows').innerHTML = labs.map(l => `<tr><td>${esc(l.d)}</td><td>${esc(l.n || '')}</td>
    <td><button data-labdel="${esc(l.d)}">remove</button></td></tr>`).join('')
    || '<tr><td colspan="3" class="muted">No panels logged. Get the baseline drawn in the next two weeks.</td></tr>';
  $('#labrows').querySelectorAll('button[data-labdel]').forEach(b => {
    b.onclick = () => {
      store.set('labs', store.get('labs', []).filter(l => l.d !== b.dataset.labdel));
      draw();
    };
  });
}

$('#save').onclick = () => {
  const d = $('#d').value;
  if (!d) return alert('Pick a date.');
  const wt = $('#wt').value === '' ? null : +$('#wt').value;
  const ws = $('#ws').value === '' ? null : +$('#ws').value;
  if (wt == null && ws == null) return alert('Enter a weight or a waist measurement.');
  const log = store.get('log', []).filter(e => e.d !== d);
  log.push({ d, wt, ws });
  store.set('log', log);
  $('#wt').value = ''; $('#ws').value = '';
  draw();
};

$('#labsave').onclick = () => {
  const d = $('#labd').value;
  if (!d) return;
  const labs = store.get('labs', []).filter(l => l.d !== d);
  labs.push({ d, n: $('#labn').value });
  store.set('labs', labs);
  $('#labn').value = '';
  draw();
};

draw();
</script>
</body>
</html>
