<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cook Day - Reset Kitchen</title>
<meta name="description" content="The timed Sunday batch-cooking plan.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('cook.html');
const w = weekData();
const mon = mondayForCycleWeek(w.n);
const cookDay = addDays(mon, -1);

$('#main').innerHTML = `
  <h1>Cook Day: Week ${w.n}</h1>
  <p class="lede">Sunday ${esc(fmtShort(cookDay))}, ${esc(w.cookTime)}. You cook one thing: <a href="recipes.html#${esc(w.pot)}">${esc(potName(w))}</a>. Everything else on this list is the oven, the kettle or a zip bag.</p>
  <div id="wb"></div>
  <div class="tools">
    <a class="btn" href="shopping.html">Shopping list first</a>
    <button id="reset">Clear the checkmarks</button>
  </div>
  <div class="card"><ol class="tl" id="tl"></ol></div>

  <h2>The dinners this buys</h2>
  <div class="card"><div id="dinners"></div></div>

  <h2>What you should have at the end</h2>
  <div class="card">
    <h3>In the fridge, with a date on it</h3>
    <div id="keeps"></div>
    <h3 style="margin-top:1.2rem">In the freezer, banked</h3>
    <div id="bank"></div>
    <p class="muted" style="margin-top:.7rem">Log the bags on the <a href="freezer.html">Storage page</a> while you are standing there.</p>
  </div>
  <details class="ref">
    <summary>Six rules that make cook day work</summary>
    <div class="card">
    <div class="qa"><b>Portion it before you put it away.</b><p>Bulk containers get eaten out of standing at the fridge. Individual portions get eaten as meals. This is the single highest-return habit of the whole day.</p></div>
    <div class="qa"><b>Decide what will not get eaten by Thursday, and freeze it now.</b><p>Four days is the honest fridge life of cooked meat. If Sunday makes eight servings and the week only has room for five, three go in the freezer today. Doing it on Thursday instead is how food gets thrown out.</p></div>
    <div class="qa"><b>Freeze flat, label with a marker.</b><p>Dish and date, written on the bag before it goes in. Flat bags stack like file folders and thaw in twenty minutes in a bowl of cold water. No vacuum sealer needed.</p></div>
    <div class="qa"><b>Let it cool before it goes in the freezer.</b><p>Warm food forms big ice crystals that wreck texture and it partly thaws whatever is next to it. Spread it on a sheet pan for fifteen minutes first, that is enough.</p></div>
    <div class="qa"><b>Save every rendered fat.</b><p>The fat off the chicken pan and the tallow skimmed off the braise are the best cooking fats you will have all week and they are free. A jar in the fridge door.</p></div>
    <div class="qa"><b>Clean as the timers run.</b><p>There are three or four twenty-minute unattended stretches in every one of these plans. Use them and you finish with an empty sink instead of a cook day followed by an argument about the kitchen.</p></div>
    </div>
  </details>
`;

$('#dinners').innerHTML = w.days.slice(0, 5).map((d, i) => {
  const src = dinnerSrc(d, true);
  return `<div class="frz">
    <span class="n"><b>${esc(d.day)} ${esc(fmtShort(addDays(mon, i)))}</b> &middot; ${esc(d.m2)}</span>
    <span class="age"><span class="badge ${src.cls}">${esc(src.label)}</span></span>
  </div>`;
}).join('');

$('#keeps').innerHTML = (w.keeps || []).map(k => {
  const by = addDays(cookDay, k.days);
  return `<div class="frz"><span class="n">${esc(k.what)}</span><span class="age">${k.days >= 30 ? 'keeps a month' : 'eat by ' + esc(fmtDay(by))}</span></div>`;
}).join('');

$('#bank').innerHTML = (w.freezer || []).map(f =>
  `<div class="frz"><span class="n">${esc(f.what)}</span><span class="age">${f.months} month${f.months === 1 ? '' : 's'}</span></div>`
).join('');

weekBar('#wb');

const key = 'cook.' + iso(cookDay);
const done = store.get(key, {});
$('#tl').innerHTML = w.cook.map((s, i) => `
  <li>
    <span class="t">${esc(s.at)}</span>
    <span class="b">
      <label style="display:flex;gap:.6rem;align-items:flex-start;cursor:pointer">
        <input type="checkbox" data-i="${i}" ${done[i] ? 'checked' : ''} style="margin-top:.28rem;width:1.05rem;height:1.05rem;accent-color:var(--accent);flex:0 0 auto">
        <span style="${done[i] ? 'text-decoration:line-through;color:var(--ink-3)' : ''}">${esc(s.do)}${s.why ? `<span class="why">${esc(s.why)}</span>` : ''}</span>
      </label>
    </span>
  </li>`).join('');

$('#tl').querySelectorAll('input').forEach(cb => {
  cb.onchange = () => {
    const s = store.get(key, {});
    if (cb.checked) s[cb.dataset.i] = 1; else delete s[cb.dataset.i];
    store.set(key, s);
    const span = cb.nextElementSibling;
    span.style.textDecoration = cb.checked ? 'line-through' : '';
    span.style.color = cb.checked ? 'var(--ink-3)' : '';
  };
});

$('#reset').onclick = () => { store.del(key); location.reload(); };
</script>
</body>
</html>
