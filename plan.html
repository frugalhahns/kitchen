<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Plan - Reset Kitchen</title>
<meta name="description" content="The rules of the reset, why each one is there, and what to do when it stalls.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('plan.html');
$('#main').innerHTML = `
  <h1>The Plan</h1>
  <p class="lede">${esc(PROTOCOL.headline)}</p>

  <h2>${esc(PROTOCOL.reset.title)}</h2>
  <div class="card"><p style="margin:0">${esc(PROTOCOL.reset.body)}</p></div>

  <h2>The rules</h2>
  <div class="card"><ol class="rules">
    ${PROTOCOL.rules.map(r => `<li><b>${esc(r.rule)}</b><p>${esc(r.detail)}</p></li>`).join('')}
  </ol></div>

  <h2>${esc(PROTOCOL.labs.title)}</h2>
  <div class="card"><p style="margin:0">${esc(PROTOCOL.labs.body)}</p></div>

  <h2>When it stops working</h2>
  <div class="card">
    ${PROTOCOL.troubleshoot.map(t => `<div class="qa"><b>${esc(t.q)}</b><p>${esc(t.a)}</p></div>`).join('')}
  </div>

  <h2>How long everything keeps</h2>
  <div class="card">
    <div class="flag reset"><b>The rule:</b> ${esc(KEEPS.headline)}</div>
    <p class="muted" style="margin:.6rem 0 0">Cooking once a week only works if none of it gets thrown away, so every recipe carries its own fridge and freezer numbers and the full table lives on the <a href="freezer.html">Storage page</a> along with the thawing rules.</p>
  </div>

  <h2>The pantry</h2>
  <div class="card">
    ${PANTRY.map(p => `<div class="qa"><b>${esc(p.item)}</b><p>${esc(p.why)}</p></div>`).join('')}
  </div>

  <h2>How the four-week cycle is built</h2>
  <div class="card">
    ${WEEKS.map(w => `<div class="qa"><b>Week ${w.n}: ${esc(w.title)} <span class="cuis">${esc(w.cuisine)}</span> <span class="muted" style="font-weight:400">${esc(w.cookTime)} cook day</span></b><p>${esc(w.theme)}</p></div>`).join('')}
    <p class="muted" style="margin-top:.8rem">One cuisine a week is what keeps it simple: one shop, one set of condiments, one spice blend on the sheet-pan chicken. Each cuisine comes around three times across the twelve weeks, and Week 4 being easy is the design rather than a gap.</p>
  </div>
`;
</script>
</body>
</html>
