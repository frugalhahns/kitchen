<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping - Reset Kitchen</title>
<meta name="description" content="The week's shopping list, by store section.">
<meta name="theme-color" content="#b8402b">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main"></main>
<script src="data/plan.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('shopping.html');
const w = weekData();
const mon = mondayForCycleWeek(w.n);
const shopDay = addDays(mon, -2);

const sections = Object.keys(w.shop);
$('#main').innerHTML = `
  <h1>Shopping: Week ${w.n}</h1>
  <p class="lede">Saturday ${esc(fmtShort(shopDay))}. Market, meat counter, one grocery run. Eat before you go.</p>
  <div id="wb"></div>
  <div class="tools">
    <button onclick="window.print()">Print or save as PDF</button>
    <button id="clear">Uncheck everything</button>
    <a class="btn" href="cook.html">Then: cook day plan</a>
  </div>
  <div class="grid two" id="lists"></div>
  <div class="card">
    <div class="flag reset"><b>This week at the market:</b> ${esc(w.market)}</div>
  </div>

  <details class="ref">
    <summary>Buy for the slot, not for the recipe</summary>
    <p class="muted">${esc(MARKET.intro)}</p>
    <div class="card">
      ${MARKET.slots.map(s2 => `<div class="qa"><b>${esc(s2.slot)}</b><p>${esc(s2.means)}</p><p class="muted" style="margin-top:.25rem">${esc(s2.how)}</p></div>`).join('')}
    </div>
  </details>

  <details class="ref">
    <summary>What is actually at a market, month by month</summary>
    <div class="card">
      ${MARKET.months.map(m => `<div class="qa"><b>${esc(m.month)}</b><p>${esc(m.at)}</p></div>`).join('')}
    </div>
  </details>

  <details class="ref">
    <summary>Market rules</summary>
    <div class="card">
      <ul style="margin:0;padding-left:1.2rem">${MARKET.rules.map(r => `<li style="margin:.4rem 0">${esc(r)}</li>`).join('')}</ul>
    </div>
  </details>

  <details class="ref">
    <summary>The pantry: one order, then stop thinking about it</summary>
    <div class="card">
      ${PANTRY.map(p => `<div class="qa"><b>${esc(p.item)}</b><p>${esc(p.why)}</p></div>`).join('')}
    </div>
  </details>
`;
weekBar('#wb');

const key = 'shop.' + iso(mon);
$('#lists').innerHTML = sections.map(sec => {
  const items = w.shop[sec];
  return `<div class="card"><h3>${esc(sec)}</h3><ul class="check" data-sec="${esc(sec)}">${
    items.map(it => `<li><label><input type="checkbox" value="${esc(it)}"><span>${esc(it)}</span></label></li>`).join('')
  }</ul></div>`;
}).join('');

const state = store.get(key, {});
$('#lists').querySelectorAll('input').forEach(cb => {
  if (state[cb.value]) cb.checked = true;
  cb.onchange = () => {
    const s = store.get(key, {});
    if (cb.checked) s[cb.value] = 1; else delete s[cb.value];
    store.set(key, s);
  };
});
$('#clear').onclick = () => { store.del(key); location.reload(); };
</script>
</body>
</html>
